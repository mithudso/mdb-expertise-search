[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdb-expertise-search"
version = "0.7.0"
description = "Hybrid keyword + semantic search CLI and TUI over a curated MongoDB / Atlas expertise corpus"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mongodb", "atlas", "semantic-search", "fts5", "tui", "llms.txt"]
dependencies = ["numpy>=1.26", "ollama-client @ git+https://github.com/mithudso/ollama-client.git"]

[project.optional-dependencies]
tui = ["textual>=0.80", "rich>=13"]
lsp = ["pygls>=2.0", "lsprotocol>=2025.0"]
mcp = ["mcp>=2.0"]
# In-process query embeddings (no Ollama process). Not part of `all`: onnxruntime has no wheel for the newest Python.
onnx = ["onnxruntime>=1.18", "tokenizers>=0.19", "huggingface_hub>=0.23"]
# `ai` is opt-in and not part of `all`: ai-auth is a private repo, so unauthenticated installs (CI) must not pull it.
ai = ["ai-auth @ git+https://github.com/mithudso/ai-auth.git"]
all = ["mdb-expertise-search[tui,lsp,mcp]"]
dev = ["mdb-expertise-search[all]", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
mdbx = "mdbx.cli:main"
mql-lsp = "mdbx.mql.server:main"

[tool.setuptools]
packages = ["mdbx", "mdbx.mql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
