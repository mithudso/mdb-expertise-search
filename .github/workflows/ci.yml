name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/sweep_customers.py
      - run: python scripts/rotate_workflow_logs.py --check
      - name: Optimizer smoke test on the example file
        run: mdbx optimize --read-only examples/slow-queries.mql || test $? -eq 1
      - run: cd editors/vscode && npm install --ignore-scripts && npm test
      - name: Index doc paths exist
        run: python scripts/check_doc_indexes.py
