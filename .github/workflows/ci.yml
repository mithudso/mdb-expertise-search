name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/sweep_customers.py
      - run: python scripts/rotate_workflow_logs.py --check
      - name: Optimizer smoke test on the example file
        run: mdbx optimize --read-only examples/slow-queries.mql || test $? -eq 1
      - run: cd editors/vscode && npm install --ignore-scripts && npm test
      - name: Chrome extension (search, optimizer and lint parity with Python goldens + UI units)
        run: cd editors/chrome && npm test
      - run: python scripts/package_chrome_extension.py
      - name: Index doc paths exist
        run: python scripts/check_doc_indexes.py

  # Release channel for the Chrome extension auto-updater (scripts/chrome_extension_autoupdate.py --source release):
  # every push to main republishes the keyword-only build on the rolling "chrome-latest" release.
  chrome-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m mdbx.cli index --skip-semantic
      - run: python scripts/package_chrome_extension.py --no-vectors
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip=$(ls dist/mongodb-expertise-chrome-*.zip)
          cp "$zip" dist/mongodb-expertise-chrome.zip
          cp editors/chrome/data/build.json dist/build.json
          gh release view chrome-latest >/dev/null 2>&1 || \
            gh release create chrome-latest --prerelease --title "Chrome extension (latest main)" \
              --notes "Rolling build of editors/chrome from main; consumed by scripts/chrome_extension_autoupdate.py --source release."
          gh release upload chrome-latest dist/mongodb-expertise-chrome.zip dist/build.json --clobber
