name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      # Base/dev extras contain public packages only. The retained private dependency
      # helper is for explicit optional ollama installs, not these offline checks.
      - run: python -m pip install -e '.[dev]'
      - run: npm ci --ignore-scripts --prefix editors/vscode
      - run: python scripts/offline_test.py -- ruff check .
      - run: python scripts/offline_test.py -- python -m pytest -q
      - run: python scripts/offline_test.py -- python -m compileall -q mdbx scripts tests
      - run: python scripts/offline_test.py -- python scripts/rotate_workflow_logs.py --check
      - run: python scripts/offline_test.py -- npm test --prefix editors/vscode
      - run: python scripts/offline_test.py -- npm test --prefix editors/chrome
      - run: python scripts/offline_test.py -- python scripts/package_chrome_extension.py --no-data
      - run: python scripts/offline_test.py -- python scripts/check_doc_indexes.py
      - name: Optimizer command smoke (validate JSON, not just exit code)
        run: |
          python scripts/offline_test.py -- python - <<'PY'
          import json, subprocess, sys
          r = subprocess.run([sys.executable, '-m', 'mdbx.cli', 'optimize', '--json', '--read-only', 'examples/slow-queries.mql'], capture_output=True, text=True, timeout=30)
          assert r.returncode in (0, 1), r.stderr
          report = json.loads(r.stdout)
          def fields(row, expected):
              return isinstance(row, dict) and all(
                  key in row and type(row[key]) in (kind if isinstance(kind, tuple) else (kind,))
                  for key, kind in expected.items())
          assert fields(report, {'input': dict, 'queries': list, 'findings': list, 'applied': list,
                                 'indexes': list, 'rewritten': type(None), 'iterations': int})
          assert fields(report['input'], {'kind': str, 'interpreted': (str, type(None))})
          query_types = {'kind': str, 'method': str, 'collection': (str, type(None)),
                         'line': int, 'column': int, 'evidence': dict}
          assert report['queries'] and all(fields(query, query_types) for query in report['queries'])
          finding_types = {'severity': str, 'code': str, 'pass': str, 'message': str,
                           'ref': (str, type(None)), 'line': int, 'column': int}
          assert all(fields(finding, finding_types) for finding in report['findings'])
          index_types = {'collection': str, 'keys': dict, 'shell': str, 'rationale': str}
          assert all(fields(index, index_types) for index in report['indexes'])
          assert report['applied'] == [] and report['rewritten'] is None
          assert report['iterations'] >= 0
          assert r.returncode == int(any(finding['severity'] in ('blocking', 'high') for finding in report['findings']))
          PY
