<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MQL Query Optimizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>MongoDB Expertise</h1>
    <button id="open-app" type="button" class="small" title="Open the full app: search, recipes, optimizer, lint, operators">Open app</button>
    <span class="local" title="Search, lint and the optimizer run inside the extension. Nothing is sent anywhere.">runs locally</span>
  </header>
  <form id="ask" class="ask" role="search">
    <input id="ask-q" type="search" autocomplete="off" placeholder="Ask MongoDB expertise… (opens the app)" aria-label="Search MongoDB expertise">
    <button type="submit" class="small primary">Search</button>
  </form>

  <main id="app">
    <p class="status" id="status" role="status">Reading your selection…</p>

    <section id="result" hidden aria-live="polite"></section>

    <details id="input-section" hidden>
      <summary id="input-label">Paste a query, pipeline or slow-query log line</summary>
      <textarea id="input" spellcheck="false" aria-labelledby="input-label" placeholder='db.orders.find({ status: "A" }).sort({ createdAt: -1 })&#10;or paste a slow-query log line, a profiler entry, a { find: … } command, a filter or a pipeline'></textarea>
      <div class="row">
        <button id="run" class="primary" type="button">Optimize</button>
        <button id="example" type="button">Try an example</button>
        <span class="kind">Ctrl/⌘+Enter runs it</span>
      </div>
    </details>
  </main>

  <footer class="foot">
    Static analysis. Confirm with <code>explain("executionStats")</code> before changing production.
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
